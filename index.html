<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>최애 퀘스트</title>
<style>
:root{
  --bg:#0b0d14; --panel:#121622; --panel-2:#171c29; --line:#252b3b; --line-2:#30374a;
  --ink:#f4f5f7; --ink-2:#cdd2df; --ink-3:#8e96a9;
  --violet:#8b5cf6; --pink:#ec4899; --green:#37c978; --red:#f05d73; --amber:#fbbf24; --gold:#f59e0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
button{font-family:inherit;}
.wrap{max-width:600px;margin:auto;padding:12px 12px 70px;position:relative;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 30px #0006;}
.title{font-size:22px;font-weight:1000;margin:0 0 8px;}
.sub{font-size:16px;font-weight:900;margin:0 0 8px;}
.lede{margin:0 0 14px;color:var(--ink-2);font-size:13px;line-height:1.5;}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.primary,.ghost,.alt{padding:12px 16px;border-radius:12px;font-weight:900;font-size:13px;cursor:pointer;}
.primary{border:0;background:#fff;color:#111827;}
.ghost{border:1px solid var(--line-2);background:transparent;color:#fff;}
.alt{border:0;background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;}
.topbar{display:flex;justify-content:flex-start;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.topbar-stack{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
.bias-pill-inline{display:inline-flex;align-items:center;}
.brand{font-weight:1000;font-size:18px;}
.pill{background:#191d2a;padding:6px 10px;border-radius:999px;font-size:11px;color:var(--ink-2);border:1px solid var(--line)}
.pill b{color:#fff;}
.global-dia{position:fixed;top:12px;right:max(12px, calc((100vw - 600px)/2 + 12px));z-index:30;background:rgba(17,24,39,.92);backdrop-filter:blur(8px);border:1px solid rgba(251,191,36,.5);color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;box-shadow:0 10px 25px rgba(0,0,0,.25);}
.corner-credit{position:fixed;right:max(10px, calc((100vw - 600px)/2 + 10px));bottom:10px;z-index:20;font-size:11px;color:#c9d0dfaa;background:rgba(11,13,20,.62);border:1px solid rgba(255,255,255,.08);padding:6px 10px;border-radius:999px;backdrop-filter:blur(6px);}
.title-screen{min-height:82vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.title-screen::before,.title-screen::after{content:"";position:absolute;border-radius:999px;filter:blur(18px);opacity:.6;}
.title-screen::before{width:240px;height:240px;background:rgba(139,92,246,.24);left:-35px;top:-40px;}
.title-screen::after{width:260px;height:260px;background:rgba(236,72,153,.18);right:-35px;bottom:-55px;}
.title-panel{position:relative;z-index:1;text-align:center;padding:26px 10px;}
.title-credit{margin-top:8px;font-size:12px;color:var(--ink-3);letter-spacing:.2px;}
.hybe-neon{font-size:42px;font-weight:1000;letter-spacing:5px;color:#e0fbff;text-shadow:0 0 6px #fff,0 0 14px #67e8f9,0 0 24px #8b5cf6,0 0 34px rgba(236,72,153,.7);animation:flicker 2.7s infinite;}
.logo-main{font-size:36px;font-weight:1000;margin:12px 0 0;line-height:1.06;background:linear-gradient(90deg,#fff,#f5d0fe,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent;}
.logo-sub{margin-top:10px;font-size:14px;letter-spacing:2px;font-weight:900;color:var(--pink);}
.title-copy{max-width:430px;margin:18px auto 0;color:var(--ink-2);font-size:13px;line-height:1.55;}
.tap-start{margin-top:24px;padding:14px 28px;border:0;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;font-weight:1000;font-size:14px;box-shadow:0 14px 30px rgba(139,92,246,.25);animation:pulse 1.9s infinite;cursor:pointer;}
.mini-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px;}
.mini-pill{padding:8px 12px;border-radius:12px;background:rgba(23,28,41,.95);border:1px solid var(--line-2);font-size:11px;color:var(--ink-2);}
.grid-select{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
.sel-item{background:var(--panel-2);border:1px solid var(--line-2);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;}
.sel-item.active{border-color:var(--pink);background:#25162a;}
.sel-item b{display:block;font-size:12px;}
.sel-item small{font-size:10px;color:var(--ink-3);}
.stagehud{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.hudgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.hudbox{background:#151a27;border:1px solid var(--line);border-radius:14px;padding:10px;}
.hrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-2);margin-bottom:4px;}
.bar{height:10px;border-radius:999px;background:#0e111a;overflow:hidden;border:1px solid #262c3d;}
.fill-stage{height:100%;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .35s ease;}
.fill-fever{height:100%;background:linear-gradient(90deg,var(--amber),#fff);transition:width .35s ease;}
.stage-chiprow{display:flex;gap:6px;flex-wrap:wrap;}
.stage-chip{font-size:11px;border-radius:999px;padding:5px 9px;background:#191d2a;border:1px solid var(--line);color:var(--ink-2);}
.cheer-banner{display:flex;align-items:center;gap:10px;background:rgba(236,72,153,.1);border:1px solid var(--pink);border-radius:14px;padding:10px 12px;margin-bottom:12px;}
.cheer-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),var(--pink));font-size:18px;flex:none;color:#fff;font-weight:900;}
.cheer-text{font-size:12px;line-height:1.35;color:#fff;font-weight:900;}
.cheer-text span{display:block;color:var(--ink-2);font-size:11px;font-weight:500;margin-top:2px;}
.event-banner{background:rgba(103,232,249,.08);border:1px solid rgba(103,232,249,.35);padding:10px 12px;border-radius:12px;font-size:12px;color:#d5fbff;margin-bottom:12px;}
.question{font-size:17px;font-weight:900;line-height:1.45;margin:0 0 14px;}
.answers{display:grid;gap:8px;}
.ans{padding:12px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);color:#fff;text-align:left;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.ans:disabled{opacity:.8;cursor:default;}
.feedback{min-height:56px;margin-top:12px;padding:10px;border-radius:12px;background:#171c29;border:1px solid var(--line-2);font-size:12px;line-height:1.45;}
.next{display:none;margin-top:10px;width:100%;padding:12px;border:0;border-radius:12px;background:#fff;color:#111827;font-weight:900;font-size:14px;cursor:pointer;}
.big-pop{font-size:28px;font-weight:1000;text-align:center;margin:8px 0;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.18);}
.reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.reward-btn{padding:14px 10px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel-2);color:#fff;cursor:pointer;text-align:center;}
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:10px 0 12px;}
.filter-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);font-size:11px;white-space:nowrap;cursor:pointer}
.filter-btn.active{background:var(--violet);color:#fff;border-color:var(--violet);}
.goods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0;max-height:470px;overflow-y:auto;padding-right:4px;}
.card-item{background:var(--panel-2);border:1px solid var(--line-2);border-radius:14px;padding:8px;text-align:center;position:relative;cursor:pointer;}
.card-item.N{border-color:#4b5563;} .card-item.R{border-color:#38bdf8;} .card-item.SR{border-color:#a855f7;box-shadow:0 0 6px #a855f744;} .card-item.UR{border-color:#ec4899;box-shadow:0 0 10px #ec489955;} .card-item.SSR{border-color:#f59e0b;box-shadow:0 0 14px #f59e0b88;}
.card-art{width:100%;height:170px;border-radius:10px;margin-bottom:8px;display:flex;flex-direction:column;align-items:center;justify-content:end;position:relative;overflow:hidden;padding:10px;background-size:cover;background-position:center;}
.card-art::before{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.1) 48%, rgba(0,0,0,.02));}
.card-art.basic{justify-content:center;background:linear-gradient(135deg,#111827,#312e81);}
.card-art .inner{position:relative;z-index:1;width:100%;}
.art-icon{font-size:38px;display:block;margin-bottom:4px;}
.art-title{font-size:12px;font-weight:1000;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8);display:block;}
.artist-tag{display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);font-size:10px;color:#fff;margin-bottom:6px;}
.card-badge{position:absolute;top:6px;right:6px;font-size:9px;font-weight:1000;padding:3px 7px;border-radius:999px;color:#fff;background:rgba(0,0,0,.7);z-index:2;}
.card-qty{position:absolute;bottom:6px;right:6px;font-size:10px;font-weight:900;padding:3px 7px;border-radius:999px;color:#fff;background:var(--pink);z-index:2;}
.card-slotmark{position:absolute;top:6px;left:6px;font-size:9px;font-weight:1000;padding:3px 7px;border-radius:999px;color:#111;background:var(--gold);z-index:2;}
.gname{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gartist{font-size:10px;color:var(--pink);font-weight:900;margin-top:2px;}
.deck-box{background:#151a27;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;}
.deck-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.dslot{border:1px dashed var(--line-2);background:#0f1320;border-radius:12px;padding:10px;text-align:center;font-size:11px;color:var(--ink-2);}
.dslot b{display:block;color:#fff;margin-bottom:3px;}
.shop-gacha{text-align:center;padding:10px 0;}
.pack{width:170px;height:240px;margin:10px auto;border-radius:18px;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,#1f1a3a,#0b0d14);font-size:18px;font-weight:1000;color:var(--gold);box-shadow:0 0 20px rgba(0,0,0,.5);cursor:pointer;}
.reveal-card{max-width:220px;margin:12px auto 0;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:999;padding:18px;}
.modal-overlay.active{display:flex;}
.modal-card{background:var(--panel);border:2px solid var(--gold);border-radius:20px;padding:16px;width:100%;max-width:360px;text-align:center;box-shadow:0 0 30px rgba(245,158,11,.3);}
.modal-art{width:100%;height:260px;border-radius:14px;margin-bottom:12px;display:flex;align-items:end;justify-content:center;padding:14px;background-size:cover;background-position:center;position:relative;overflow:hidden;}
.modal-art::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.18));}
.modal-inner{position:relative;z-index:1;}
.modal-title{font-size:17px;font-weight:1000;margin-bottom:4px;}
.modal-meta{font-size:12px;color:var(--ink-2);margin-bottom:8px;}
.modal-effect{font-size:12px;color:var(--amber);background:rgba(245,158,11,.1);padding:8px;border-radius:10px;margin-bottom:12px;}
.small-note{font-size:11px;color:var(--ink-3);}
@keyframes pulse{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-2px) scale(1.02);}}
@keyframes flicker{0%,19%,21%,23%,80%,100%{opacity:1;}20%,24%,79%{opacity:.72;}}

/* V32 reward loop + hologram */
.card-art.holo-SR::after,.modal-art.holo-SR::after,
.card-art.holo-UR::after,.modal-art.holo-UR::after,
.card-art.holo-SSR::after,.modal-art.holo-SSR::after{
  content:"";position:absolute;inset:-35%;z-index:1;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 27%,rgba(255,255,255,.08) 36%,rgba(103,232,249,.28) 43%,rgba(236,72,153,.25) 49%,rgba(251,191,36,.24) 55%,rgba(255,255,255,.08) 62%,transparent 72%);
  transform:translateX(-50%) rotate(8deg);animation:holoSweep 4.8s linear infinite;
}
.card-art.holo-UR::after,.modal-art.holo-UR::after{animation-duration:3.8s;opacity:.9;}
.card-art.holo-SSR::after,.modal-art.holo-SSR::after{animation-duration:2.8s;opacity:1;background:linear-gradient(115deg,transparent 22%,rgba(255,255,255,.12) 31%,rgba(103,232,249,.42) 39%,rgba(167,139,250,.38) 47%,rgba(236,72,153,.38) 54%,rgba(251,191,36,.42) 61%,rgba(255,255,255,.12) 70%,transparent 79%);}
.card-art.holo-SSR{box-shadow:inset 0 0 22px rgba(251,191,36,.28),0 0 16px rgba(245,158,11,.22);}
.reward-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.reward-stat{background:#151a27;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;}
.reward-stat b{display:block;font-size:17px;color:#fff;margin-bottom:2px}.reward-stat span{font-size:10px;color:var(--ink-3)}
.rank-S{color:#fbbf24!important;text-shadow:0 0 12px rgba(251,191,36,.35)}.rank-A{color:#c4b5fd!important}.rank-B{color:#7dd3fc!important}.rank-C{color:#cbd5e1!important}
.currency-row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.currency-chip{padding:7px 10px;border-radius:999px;background:#191d2a;border:1px solid var(--line);font-size:11px;color:var(--ink-2)}
.shop-list{display:grid;gap:8px;margin-top:12px}.shop-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:14px;padding:11px}.shop-item .desc{font-size:11px;color:var(--ink-2);line-height:1.35}.shop-item b{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.milestone{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#151a27;border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:7px;font-size:11px}.milestone.done{opacity:.55}.milestone button{padding:7px 9px;border-radius:9px;border:0;font-weight:900;cursor:pointer}
.duplicate-toast{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.45);border-radius:12px;padding:9px 11px;margin-top:10px;font-size:11px;color:#fde68a;text-align:center}
@keyframes holoSweep{0%{transform:translateX(-55%) rotate(8deg)}50%{transform:translateX(35%) rotate(8deg)}100%{transform:translateX(115%) rotate(8deg)}}


/* V33 LIVE STAGE VISUALS */
.concert-arena{position:relative;height:205px;border-radius:18px;overflow:hidden;margin:0 0 12px;border:1px solid #353c51;background:radial-gradient(circle at 50% 18%,rgba(139,92,246,.28),transparent 26%),linear-gradient(#080a12 0 56%,#101525 56% 100%);box-shadow:inset 0 -28px 60px rgba(0,0,0,.55),0 12px 28px rgba(0,0,0,.28);--artist-glow:#c084fc;}
.concert-arena.fever{animation:arenaPulse 1s ease-in-out infinite alternate;background:radial-gradient(circle at 50% 16%,color-mix(in srgb,var(--artist-glow) 48%,transparent),transparent 35%),linear-gradient(#0b0d18 0 55%,#161428 55% 100%);}
.concert-arena.encore{box-shadow:inset 0 -18px 52px rgba(0,0,0,.42),0 0 32px color-mix(in srgb,var(--artist-glow) 38%,transparent);}
.arena-stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:33px 31px;opacity:.18;pointer-events:none;}
.stage-platform{position:absolute;left:50%;top:43px;transform:translateX(-50%);width:58%;height:77px;border-radius:13px 13px 5px 5px;background:linear-gradient(180deg,#20263a,#0c0f18);border:1px solid rgba(255,255,255,.16);box-shadow:0 0 26px color-mix(in srgb,var(--artist-glow) 24%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:4;overflow:hidden;}
.stage-platform::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,transparent,var(--artist-glow),#fff,var(--artist-glow),transparent);box-shadow:0 0 12px var(--artist-glow);}
.stage-artist{font-size:16px;font-weight:1000;letter-spacing:.5px;text-shadow:0 0 12px var(--artist-glow);}
.stage-phase{font-size:10px;color:var(--ink-2);margin-top:5px;letter-spacing:1.2px;}
.stage-percent{font-size:10px;color:#fff;margin-top:5px;font-weight:900;}
.spot-beam{position:absolute;top:-52px;width:75px;height:175px;background:linear-gradient(to bottom,rgba(255,255,255,.38),rgba(192,132,252,.12),transparent);filter:blur(5px);opacity:.32;transform-origin:top center;z-index:2;pointer-events:none;}
.spot-beam.b1{left:18%;transform:rotate(20deg)} .spot-beam.b2{right:18%;transform:rotate(-20deg)}
.fever .spot-beam{opacity:.78;animation:beamMove 1.25s ease-in-out infinite alternate;}
.encore-banner{position:absolute;left:50%;top:11px;transform:translateX(-50%);z-index:7;padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid var(--artist-glow);font-size:12px;font-weight:1000;letter-spacing:2px;color:#fff;text-shadow:0 0 8px var(--artist-glow);animation:encoreBlink .75s ease-in-out infinite alternate;}
.crowd{position:absolute;left:8px;right:8px;bottom:8px;height:74px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(4,1fr);gap:3px 5px;align-items:end;z-index:6;transform:perspective(220px) rotateX(13deg);transform-origin:bottom;}
.lightstick{height:13px;position:relative;opacity:.16;transition:opacity .28s ease,filter .28s ease,transform .28s ease;}
.lightstick::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#596070;box-shadow:none;}
.lightstick::after{content:"";position:absolute;left:50%;top:5px;transform:translateX(-50%);width:2px;height:8px;border-radius:2px;background:#5b6070;}
.lightstick.on{opacity:.95;filter:drop-shadow(0 0 5px var(--artist-glow));transform:translateY(-1px);}
.lightstick.on::before{background:var(--artist-glow);box-shadow:0 0 7px var(--artist-glow),0 0 12px color-mix(in srgb,var(--artist-glow) 65%,#fff);}
.lightstick.on::after{background:#dbe2ef;}
.fever .lightstick.on{animation:stickWave .48s ease-in-out infinite alternate;}
.stage-fx{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;}
.stage-fx.show{animation:fxPop .85s ease-out forwards;}
.stage-fx span{font-size:30px;font-weight:1000;letter-spacing:1px;color:#fff;text-shadow:0 0 9px var(--artist-glow),0 0 20px var(--artist-glow);transform:rotate(-4deg);}
.stage-spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 9px var(--artist-glow);pointer-events:none;animation:sparkFly .9s ease-out forwards;z-index:14;}
.finale-wrap{position:relative;border-radius:18px;overflow:hidden;padding:22px 14px;margin-bottom:14px;text-align:center;background:radial-gradient(circle at center,color-mix(in srgb,var(--artist-glow,#c084fc) 38%,transparent),transparent 48%),linear-gradient(135deg,#111529,#090b13);border:1px solid #343b50;}
.finale-lights{font-size:20px;letter-spacing:5px;animation:finaleGlow .8s ease-in-out infinite alternate;margin:10px 0;}
.finale-stars{font-size:23px;animation:finaleRise 1.5s ease-in-out infinite alternate;}
@keyframes arenaPulse{from{filter:saturate(1)}to{filter:saturate(1.45) brightness(1.12)}}
@keyframes beamMove{from{transform:rotate(9deg)}to{transform:rotate(30deg)}}
@keyframes encoreBlink{from{opacity:.72;box-shadow:0 0 5px var(--artist-glow)}to{opacity:1;box-shadow:0 0 17px var(--artist-glow)}}
@keyframes stickWave{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-4px) rotate(5deg)}}
@keyframes fxPop{0%{opacity:0;transform:scale(.65)}25%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@keyframes finaleGlow{from{filter:drop-shadow(0 0 2px #fff)}to{filter:drop-shadow(0 0 12px var(--artist-glow,#c084fc));transform:scale(1.03)}}
@keyframes finaleRise{from{transform:translateY(3px)}to{transform:translateY(-4px)}}


/* V37 SPECIAL CUT-IN */
.phase-track{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:0 0 10px;}
.phase-step{position:relative;padding:8px 4px;border-radius:10px;background:#111522;border:1px solid #282f42;text-align:center;overflow:hidden;opacity:.52;transition:.25s;}

.artist-cutin-overlay{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.38);overflow:hidden;animation:cutinBackdrop .95s ease both;}

.cutin-shell{position:relative;width:min(92vw,560px);height:310px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 18px 34px rgba(0,0,0,.55));}

.artist-cutin-overlay[data-dir="right"] .cutin-card{animation-name:cutinCardInRight;}
.artist-cutin-overlay[data-dir="right"] .cutin-copy{left:auto;right:50%;transform:translate(-4%,-50%);text-align:right;animation-name:cutinTextInRight;}

@keyframes cutinBackdrop{0%{opacity:0}14%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes cutinSweep{0%{transform:translateX(-34%) rotate(-4deg);opacity:0}30%{opacity:1}100%{transform:translateX(34%) rotate(4deg);opacity:0}}
@keyframes cutinCardIn{0%{transform:translateX(-190px) rotate(-14deg) scale(.72);opacity:0}55%{transform:translateX(-96px) rotate(-4deg) scale(1.05);opacity:1}100%{transform:translateX(-110px) rotate(-6deg) scale(1);opacity:1}}

(function(){
  let lastMsg='', lastAt=0;
  function report(msg){
    try{ console.error('[CQ]', msg); }catch(e){}
    const launch=document.getElementById('launchMessage');
    if(launch){ launch.innerHTML='게임을 불러오는 중 오류가 발생했어요.<br>페이지를 새로고침해 주세요. 계속되면 다른 브라우저(Safari/Chrome)로 열어 주세요.<br><small style="opacity:.6">'+String(msg).replace(/[<>&]/g,'')+'</small>'; return; }
    const now=Date.now(); if(msg===lastMsg && now-lastAt<4000) return; lastMsg=msg; lastAt=now;
    document.querySelector('.cq-error-toast')?.remove();
    const el=document.createElement('div'); el.className='cq-error-toast'; el.setAttribute('role','alert');

function reverseArtistQuestion(q){

  else if(key.startsWith('member_')) stem=`‘${ans}’이(가) 속한 아티스트는?`;
  else if(key.startsWith('album_')) stem=`‘${ans}’은(는) 어느 아티스트의 음반인가?`;
  else if(key.startsWith('song_rec_')) stem=`‘${ans}’은(는) 어느 아티스트의 곡인가?`;
  else if(key==='meta_release') stem=`데뷔 음반/EP가 ‘${ans}’인 아티스트는?`;
  else if(key==='meta_song') stem=`데뷔 대표곡이 ‘${ans}’인 아티스트는?`;

  const wrong=shuffle(ARTISTS.filter(a=>a!==q.artist)).slice(0,3);

function styleQuestion(q, owner, groupId, roundIndex, mode, fresh){
  let style=chooseQuestionStyle(owner,groupId,roundIndex,mode);
  const correct=answerText(q); const wrongs=q.a.filter((_,i)=>i!==q.c);
  let out={...q,_groupId:groupId,_fresh:!!fresh,qtype:style};
  if(style==='BLANK'){
    const exp=String(q.e||'');
    if(correct && exp.includes(correct)){
      out.q=`빈칸에 들어갈 정답을 고르세요. ${exp.replace(correct,'【 ____ 】')}`;
    }else{

    }

    const makeFalse=Math.random()<.48 && wrongs.length;
    let statement=String(q.e||q.q);
    if(makeFalse && correct && statement.includes(correct)){
      statement=statement.replace(correct,pick(wrongs));
      out.a=['O','X']; out.c=1;
    }else{
      out.a=['O','X']; out.c=0;

function pickActGroups(source, actIndex, pickedSet){
  const preferences=[

    ['member','album','meta','song','extra','etc'],
    ['song','album','member','extra','meta','etc'],
    ['extra','song','album','member','meta','etc']
  ][actIndex];
  const result=[];
  for(const cat of preferences){
    const bucket=shuffle(source.filter(g=>g.category===cat && !pickedSet.has(g.id)));
    for(const g of bucket){ if(result.length>=4) break; result.push(g); pickedSet.add(g.id); }
    if(result.length>=4) break;
  }

    for(const g of shuffle(source.filter(g=>!pickedSet.has(g.id)))){ if(result.length>=4) break; result.push(g); pickedSet.add(g.id); }

}

    for(let act=0;act<4;act++) picked.push(...pickActGroups(source,act,pickedSet));
    fillPickList(picked,source,pickedSet,16);
  }else{
    const byArtist={}; source.forEach(g=>(byArtist[g.artist] ||= []).push(g));
    const artistOrder=shuffle(Object.keys(byArtist));
    while(picked.length<16){
      let moved=false;
      for(const artist of artistOrder){
        if(picked.length>=16) break;
        const next=(byArtist[artist]||[]).find(g=>!pickedSet.has(g.id));
        if(next){picked.push(next);pickedSet.add(next.id);moved=true;}
      }
      if(!moved) break;
    }
    fillPickList(picked,source,pickedSet,16);
  }
  const finalGroups=picked.slice(0,16);
  const freshSet=new Set(fresh.map(g=>g.id));
  const styled=finalGroups.map((g,idx)=>styleQuestion(pickQuestionVariant(g,owner),owner,g.id,idx,mode,freshSet.has(g.id)));
  rememberStageQuestions(owner,finalGroups);
  return styled;
}

   (다른 도구가 같은 주소에 저장한 값은 내보내지도, 덮어쓰지도, 지우지도 않습니다.) */
const SAVE_PREFIX = 'cq_';
function saveKeys(){
  const keys = [];
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith(SAVE_PREFIX)) keys.push(k); } }catch(e){}
  return keys;
}
function getSaveSnapshot(){
  const out = { game:'CHOIAE_QUEST', version:CQ_RELEASE, createdAt:new Date().toISOString(), storage:{} };
  saveKeys().forEach(k => { out.storage[k] = localStorage.getItem(k); });
  return out;
}
function validateSave(data){
  if(!data || typeof data!=='object' || !data.storage || typeof data.storage!=='object' || Array.isArray(data.storage)) return {ok:false, error:'저장 파일 형식이 올바르지 않습니다.'};
  const keys = [], ignored = [];
  for(const [k,v] of Object.entries(data.storage)){
    if(!k.startsWith(SAVE_PREFIX)){ ignored.push(k); continue; }
    if(typeof v!=='string') return {ok:false, error:'저장 파일에 올바르지 않은 값이 있습니다.'};
    try{ JSON.parse(v); }catch(e){ return {ok:false, error:`저장 파일의 ${k} 값이 손상되었습니다.`}; }
    keys.push(k);
  }
  if(!keys.length) return {ok:false, error:'이 게임의 저장 데이터가 들어 있지 않은 파일입니다.'};
  return {ok:true, keys, ignored};
}
function clearSave(){ saveKeys().forEach(k => localStorage.removeItem(k)); }
function applySaveSnapshot(data){
  const v = validateSave(data); if(!v.ok) throw new Error(v.error);
  clearSave();
  v.keys.forEach(k => localStorage.setItem(k, data.storage[k]));
  return v;
}
function exportSave(){
  const blob = new Blob([JSON.stringify(getSaveSnapshot(),null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'choiae_quest_save_' + CQ_RELEASE + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importSaveFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data, v;
    try{ data = JSON.parse(reader.result); }catch(e){ return alert('저장 파일 형식이 올바르지 않습니다.'); }
    v = validateSave(data); if(!v.ok) return alert(v.error);
    if(!confirm(`현재 진행 데이터를 백업 파일의 내용(${v.keys.length}개 항목)으로 교체할까요?`)) return;
    try{ applySaveSnapshot(data); }catch(e){ return alert(e.message); }
    alert('저장 데이터 불러오기가 완료됐습니다.'); location.reload();
  };
  reader.readAsText(file);
}

function beginStoryChapter(index){

  const chapter=STORY_CHAPTERS[index],artist=myBias;
  startStage('artist');
  if(!gameState)return;
  const positions=[0,4,8],removed=new Set();
  positions.forEach((position,slot)=>{const q=gameState.questions[position];if(q)removed.add(q._groupId||(q.artist+'::'+(q.key||q.q)));});
  const custom=STORY_PUZZLES[index].map((q,slot)=>({...q,artist,key:`v53_story_${index+1}_${slot+1}`,variant:'story',qtype:'이야기 퍼즐',_groupId:`${artist}::v53_story_${index+1}_${slot+1}`}));
  positions.forEach((position,slot)=>{gameState.questions[position]=custom[slot];});
  questionHistory[artist]=(questionHistory[artist]||[]).filter(id=>!removed.has(id));
  rememberStageQuestions(artist,gameState.questions.map(q=>({id:q._groupId||(q.artist+'::'+(q.key||q.q))})));
  gameState.mode='artist';
  gameState.storyRun={artist,index,title:chapter.title};

}

    ['에피소드 구성',STORY_CHAPTERS.length===6&&STORY_CHAPTERS.every(c=>c.title&&c.scene),STORY_CHAPTERS.length],
    ['이야기 퍼즐',STORY_PUZZLES.length===STORY_CHAPTERS.length&&STORY_PUZZLES.every(set=>set.length===3&&set.every(q=>q.a?.length===4&&q.c>=0&&q.c<q.a.length)),STORY_PUZZLES.length*3],
    ['뽑기 확률 합계 100%',['std','prem'].every(k=>Math.abs(Object.values(RARITY_RATE[k]).reduce((a,b)=>a+b,0)-100)<1e-9),'일반 '+Object.values(RARITY_RATE.std).join('/')+' · 프리미엄 '+Object.values(RARITY_RATE.prem).join('/')],
    ['로컬 저장소',storageOK,storageOK?'사용 가능':'사용 불가']
  ];
  const t0 = Date.now(); const flowRows = qaRunFlow(); const ms = Date.now()-t0;
  const rowHTML = rows => rows.map(([k,ok,d])=>`<div class="qa-row"><span>${k}</span><b class="${ok?'qa-ok':'qa-warn'}">${ok?'PASS':'FAIL'}${d?` · ${d}`:''}</b></div>`).join('');
  const failed = dataRows.filter(r=>!r[1]).length + flowRows.filter(r=>!r[1]).length, total = dataRows.length + flowRows.length;
  hideDock(); updateHUD();
  $('app').innerHTML=`<div class="card"><div class="v50-kicker">SELF TEST</div><h2 class="sub">🧪 ${window.CQ_RELEASE} 진단</h2><div class="qa-row"><span>전체 결과 · 이야기 진행 ${storyCompletedCount()}/${STORY_CHAPTERS.length}</span><b class="${failed?'qa-warn':'qa-ok'}">${total-failed}/${total} 통과</b></div><div class="v50-kicker" style="margin-top:12px">데이터 점검</div>${rowHTML(dataRows)}<div class="v50-kicker" style="margin-top:12px">게임 흐름 점검 · 내 진행 데이터는 건드리지 않아요 (${ms}ms)</div>${rowHTML(flowRows)}<div class="v50-qa-note">사진은 외부 서버에서 불러오기 때문에 실행 환경과 네트워크에 따라 표시되지 않을 수 있습니다. 사진이 없어도 카드 프레임과 정보는 정상 표시됩니다.</div><div class="btns"><button class="primary" onclick="settingsView()">설정으로</button><button class="ghost" onclick="qaView()">다시 실행</button><button class="ghost" onclick="lobby()">로비로</button></div></div>`;
}
window.qaView=qaView;

grantStarterIfNeeded(); ensureDailyMissions(); persistCore(); updateHUD(); titleScreen();
</script>
